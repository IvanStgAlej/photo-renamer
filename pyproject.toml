[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-renamer"
version = "1.0.0"
description = "Desktop tool that imports camera photos into day folders and renames them by EXIF capture time"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Iván Santiago Alejano" }]
requires-python = ">=3.10"
dependencies = ["exifread>=3.0"]

[project.optional-dependencies]
dev = ["pillow>=10.0"]

[project.gui-scripts]
photo-renamer = "photo_renamer.gui:main"

[project.urls]
Repository = "https://github.com/IvanStgAlej/photo-renamer"

[tool.setuptools]
packages = ["photo_renamer"]
